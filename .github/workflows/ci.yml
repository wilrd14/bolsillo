name: Bolsillo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bolsillo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno test --allow-read --config supabase/functions/scan-receipt/deno.json supabase/functions/scan-receipt
      - run: deno test --allow-read --config supabase/functions/delete-account/deno.json supabase/functions/delete-account
